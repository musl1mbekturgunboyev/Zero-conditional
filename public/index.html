<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero Conditional · Live Class</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#152f2b;font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:44px}.brand{font-weight:850;font-size:20px}.pill{font-size:12px;letter-spacing:1px;padding:9px 12px;border:1px solid #bfd0c7;border-radius:30px}h1{font-size:clamp(38px,7vw,68px);line-height:1.04;letter-spacing:-2px;margin:16px 0}h2{font-size:clamp(25px,4vw,38px);line-height:1.2}p{color:#586e67;line-height:1.7}.eyebrow{color:#127f61;font-weight:800;letter-spacing:2px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.card{background:white;border:1px solid #dce5de;border-radius:22px;padding:28px;box-shadow:0 8px 30px #12352605}.dark{background:#153f34;color:white}.dark p{color:#c4d9cd}input,button{font:inherit}input{width:100%;padding:15px;margin:7px 0 14px;border:1px solid #c7d4cb;border-radius:10px;background:#f9fbf7;color:#153f34}button{cursor:pointer;border:0;border-radius:10px;padding:14px 20px;font-weight:750;background:#d9f07a;color:#153f34}button:hover{filter:brightness(.96)}button:disabled{cursor:default;opacity:.58}.secondary{background:#e8eee7}.wide{width:100%}.stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.code{font-size:clamp(40px,10vw,70px);letter-spacing:8px;font-weight:900}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{text-align:left;background:#eff3ed;min-height:80px;border:2px solid transparent;font-size:18px}.option.selected{border-color:#1b8362;background:#dff2e5}.option.correct{background:#c9edb7;border-color:#528c38}.option.wrong{background:#f9dedb;border-color:#ca6b61}.badge{display:inline-flex;width:29px;height:29px;align-items:center;justify-content:center;background:white;border-radius:7px;margin-right:10px}.muted{font-size:14px;color:#6b8075}.notice{background:#edf4df;padding:15px;border-radius:10px;margin-top:20px;line-height:1.6}.leader{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e5ebe2}.leader.me{color:#127f61;font-weight:800}#error{color:#a43128;line-height:1.5;margin:14px 0}progress{width:100%;height:8px;accent-color:#388368;margin:18px 0}footer{text-align:center;color:#7a8b81;font-size:12px;margin:32px 0}.small{font-size:13px}.wait{font-size:45px;margin:12px 0}.link{word-break:break-all;color:#167256}.timer{font-weight:900;font-size:27px;color:#127f61}label{font-size:13px;font-weight:700}@media(max-width:650px){.grid,.options{grid-template-columns:1fr}header{margin-bottom:28px}.card{padding:21px}.option{min-height:65px}h1{letter-spacing:-1px}}
</style><main><header><div class="brand">z<span style="color:#4c9867">c</span>. classroom</div><span class="pill">ENGLISH / A2–B1</span></header><div id="error" role="alert"></div><div id="app"></div><footer>ZERO CONDITIONAL · 27 o‘quvchi · 12 savol · har biri 30 soniya</footer></main><script>
let session;try{session=JSON.parse(localStorage.getItem('zc-session'))}catch{}let state,busy=false,posting=false,lastKey='';const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'Ulanishda xato');return v;}
function error(e){document.querySelector('#error').textContent=e?.message||'';}
function save(s){session=s;localStorage.setItem('zc-session',JSON.stringify(s));lastKey='';}
function home(){app.innerHTML='<div class="eyebrow">LEARN IT. PLAY IT. REMEMBER IT.</div><h1>If you play,<br><span style="color:#27815f">you learn.</span></h1><p>Zero Conditional bilimlaringizni jonli o‘yinda sinang.<br>Telefoningiz, taxallusingiz va xona kodi yetarli.</p><div class="grid"><section class="card"><h2>O‘yinga qo‘shilish</h2><form id="join"><label>XONA KODI</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 xonali kod" required><label>TAXALLUSINGIZ</label><input id="name" maxlength="24" placeholder="Masalan: Student 07" required><button class="wide">Qo‘shilish →</button></form></section><section class="card dark"><div class="eyebrow" style="color:#d9f07a">O‘QITUVCHI UCHUN</div><h2>Sinfni o‘yinga<br>taklif qiling.</h2><p>Xona oching, kodni ulashing va barcha o‘quvchilar kirgach boshlang. Har bir to‘g‘ri javob — 100 ball.</p><button id="create" class="wide">Yangi xona ochish +</button><p class="small">Taxalluslardan foydalaning. Xona 24 soat amal qiladi.</p></section></div><div class="notice"><b>Eslatma:</b> If + Present Simple, Present Simple.<br>If you heat ice, it melts. — Agar muzni qizdirsangiz, u eriydi.</div>';
document.querySelector('#code').value=new URLSearchParams(location.search).get('room')||'';
document.querySelector('#join').onsubmit=async e=>{e.preventDefault();if(posting)return;posting=true;try{error();save(await api('join',{code:document.querySelector('#code').value,name:document.querySelector('#name').value}));await poll();}catch(e){error(e)}finally{posting=false}};
document.querySelector('#create').onclick=async e=>{e.target.disabled=true;try{error();save(await api('create',{}));await poll()}catch(x){error(x);e.target.disabled=false}};
}
function board(){return '<div class="card" style="margin-top:20px"><h2>Ballar jadvali</h2>'+state.scores.map((p,i)=>'<div class="leader '+(p.me?'me':'')+'"><span>'+String(i+1).padStart(2,'0')+' &nbsp; '+esc(p.name)+(p.me?' (siz)':'')+'</span><b>'+p.score+' ball</b></div>').join('')+'</div>';}
function render(){const s=state,host=!!session.secret;let out='<div class="stats"><span class="eyebrow">'+(host?'O‘QITUVCHI PANELI':'JONLI VIKTORINA')+'</span><button id="leave" class="secondary small">Bosh sahifa</button></div>';
if(s.phase==='lobby'){out+='<div class="grid"><section class="card dark"><span class="pill">XONA KODI</span><div class="code">'+s.code+'</div><p>O‘quvchilar havolaga kirib, shu kodni yozadi.</p><button id="copy">Taklif havolasini nusxalash</button></section><section class="card"><span class="eyebrow">KUTISH XONASI</span><div class="wait">'+s.count+' <small style="font-size:20px">/ 27</small></div><p>'+(host?'Barcha o‘quvchilar kirgach o‘yinni boshlang.':'Siz kirdingiz! O‘qituvchi o‘yinni boshlashini kuting.')+'</p>'+(host?'<button id="start" class="wide" '+(!s.count?'disabled':'')+'>O‘yinni boshlash →</button>':'')+'</section></div>'+board();}
else if(s.phase==='finished'){const top=s.scores[0]?.score;out+='<section class="card" style="margin-top:24px"><div class="eyebrow">WELL PLAYED!</div><h1>O‘yin yakunlandi.</h1><p>G‘olib'+(s.scores.filter(p=>p.score===top).length>1?'lar':'')+': <b>'+s.scores.filter(p=>p.score===top).map(p=>esc(p.name)).join(', ')+'</b></p><div class="notice">If + Present Simple, Present Simple.<br>Faktlar, tabiat qonunlari va odatlar uchun.</div><p>Yangi o‘yin uchun bosh sahifaga qayting va yangi xona oching.</p></section>'+board();}
else{let q=s.question;out+='<progress value="'+(s.index+1)+'" max="'+s.total+'"></progress><div class="stats"><b>SAVOL '+(s.index+1)+' / '+s.total+'</b><span id="timer" class="timer"></span><span>'+s.answered+' / '+s.count+' javob</span></div><section class="card" style="margin-top:18px"><h2>'+esc(q.text)+'</h2><div class="options">'+q.options.map((o,i)=>'<button class="option '+(s.mine===i?'selected ':'')+(s.phase==='reveal'?(q.correct===i?'correct':s.mine===i?'wrong':''):'')+'" data-choice="'+i+'" '+(host||s.phase!=='question'||s.mine!==null||s.remaining===0?'disabled':'')+'><span class="badge">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>').join('')+'</div>'+(s.phase==='reveal'?'<div class="notice"><b>To‘g‘ri javob: '+String.fromCharCode(65+q.correct)+'</b><br>'+esc(q.explanation)+'</div>':s.mine!==null?'<div class="notice">Javobingiz qabul qilindi. Natijani kuting.</div>':'<p class="muted">'+(host?'O‘quvchilar o‘z telefonida javobni tanlaydi.':'Bitta javobni tanlang. Har bir to‘g‘ri javob — 100 ball.')+'</p>')+(host?'<button id="control" class="wide" style="margin-top:20px">'+(s.phase==='question'?'Javobni ko‘rsatish':s.index===s.total-1?'Yakuniy natijalar →':'Keyingi savol →')+'</button>':'')+'</section>'+(s.phase==='reveal'?board():'');}
app.innerHTML=out;document.querySelector('#leave').onclick=()=>{if(session.secret&&!confirm('O‘qituvchi panelidan chiqasizmi?'))return;session=null;localStorage.removeItem('zc-session');home();};
const copy=document.querySelector('#copy');if(copy)copy.onclick=async()=>{const link=location.origin+'/?room='+s.code;try{await navigator.clipboard.writeText(link);copy.textContent='Nusxalandi ✓'}catch{prompt('Havolani nusxalang:',link)}};
const start=document.querySelector('#start');if(start)start.onclick=()=>control('start');const c=document.querySelector('#control');if(c)c.onclick=()=>control(s.phase==='question'?'reveal':'next');document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=async()=>{if(posting)return;posting=true;el.disabled=true;try{await api('answer',{...session,question:s.index,choice:Number(el.dataset.choice)});lastKey='';await poll()}catch(e){error(e)}finally{posting=false}});tick();}
async function control(move){if(posting)return;posting=true;try{error();await api('control',{...session,move,question:state.index});lastKey='';await poll()}catch(e){error(e)}finally{posting=false}}
async function poll(){if(!session||busy)return;busy=true;try{const v=await api('state',session);state=v;error();const key=JSON.stringify({...v,remaining:undefined});if(key!==lastKey){lastKey=key;render()}tick();}catch(e){error(e)}finally{busy=false}}
function tick(){const el=document.querySelector('#timer');if(el&&state){el.textContent=state.phase==='reveal'?'Natija':state.remaining+' s';if(state.remaining===0)document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true)}}
home();if(session)poll();setInterval(poll,2000);
</script></html>
