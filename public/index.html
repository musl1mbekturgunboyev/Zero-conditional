<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero Conditional · Live Class</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#152f2b;font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:44px}.brand{font-weight:850;font-size:20px}.pill{font-size:12px;letter-spacing:1px;padding:9px 12px;border:1px solid #bfd0c7;border-radius:30px}h1{font-size:clamp(38px,7vw,68px);line-height:1.04;letter-spacing:-2px;margin:16px 0}h2{font-size:clamp(25px,4vw,38px);line-height:1.2}p{color:#586e67;line-height:1.7}.eyebrow{color:#127f61;font-weight:800;letter-spacing:2px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.card{background:white;border:1px solid #dce5de;border-radius:22px;padding:28px;box-shadow:0 8px 30px #12352605}.dark{background:#153f34;color:white}.dark p{color:#c4d9cd}input,button{font:inherit}input{width:100%;padding:15px;margin:7px 0 14px;border:1px solid #c7d4cb;border-radius:10px;background:#f9fbf7;color:#153f34}button{cursor:pointer;border:0;border-radius:10px;padding:14px 20px;font-weight:750;background:#d9f07a;color:#153f34}button:hover{filter:brightness(.96)}button:disabled{cursor:default;opacity:.58}.secondary{background:#e8eee7}.wide{width:100%}.stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.code{font-size:clamp(40px,10vw,70px);letter-spacing:8px;font-weight:900}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{text-align:left;background:#eff3ed;min-height:80px;border:2px solid transparent;font-size:18px}.option.selected{border-color:#1b8362;background:#dff2e5}.option.correct{background:#c9edb7;border-color:#528c38}.option.wrong{background:#f9dedb;border-color:#ca6b61}.badge{display:inline-flex;width:29px;height:29px;align-items:center;justify-content:center;background:white;border-radius:7px;margin-right:10px}.muted{font-size:14px;color:#6b8075}.notice{background:#edf4df;padding:15
